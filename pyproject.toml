[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-ops-reporting"
version = "0.1.0"
description = "Annotation operations metrics, Feishu Base synchronization, and daily/weekly reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Grace981120" }]
dependencies = ["PyMySQL>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

